name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every channel flag off: this is the plain sideload build, so no Google
  # binary is on the compile classpath and CI never needs a Play SDK.
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # The test tasks build native/wm-engine-jni for this runner first
      # (build-host.sh), so the JVM suites and the prediction and glide evals
      # run the real Rust engine. The runner image has cargo; this keeps its
      # build between runs, and the engine's own test build.
      - name: Cache the Rust engine's host build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/wm-engine
            native/wm-engine-jni

      # The engine's own tests (the glide join and frequency-weight ones
      # among them), which no Gradle task runs.
      - name: Test the Rust engine
        run: cargo test --release --manifest-path native/wm-engine/Cargo.toml

      - name: Run unit tests
        # `unitTests` and not a bare testIntlDebugUnitTest: :app carries the
        # `languages` flavour and the library modules do not, so no single
        # flavoured task name reaches both. The aggregate in the root build
        # does.
        run: ./gradlew unitTests -Pwmkb.skipBenchmarks=true --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # Four jobs on separate runners at the same time. The English build is here
  # to prove the localeFilters path still packages, which nothing else would
  # catch before a release was already being cut. The F-Droid one compiles
  # with -Pwmkb.enableFdroid=true, which swaps in the src/nogoogle stand-ins
  # for the ML Kit code and drops Google's SDKs: the only build that compiles
  # them, so the only place a broken stand-in shows up before F-Droid's own
  # build fails. BOOX compiles the otherwise-isolated Onyx backend in a
  # standard non-Play channel; the release workflow exercises its R8 packaging.
  assemble:
    name: Assemble ${{ matrix.build }} ${{ matrix.language }} debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build: standard, language: intl }
          - { build: standard, language: en }
          - { build: fdroid, language: intl }
          - { build: boox, language: en }
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # Capitalised: assembleIntlDebug, assembleEnDebug. AGP names the output
      # directory after the flavour: app/build/outputs/apk/intl/debug/.
      - name: Assemble
        run: |
          language='${{ matrix.language }}'
          flags=()
          [ '${{ matrix.build }}' = fdroid ] && flags+=(-Pwmkb.enableFdroid=true)
          [ '${{ matrix.build }}' = boox ] && flags+=(-Pwmkb.enableOnyxPen=true)
          ./gradlew "assemble${language^}Debug" "${flags[@]}" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.build }}-${{ matrix.language }}-debug
          path: app/build/outputs/apk/${{ matrix.language }}/debug/*.apk
          retention-days: 7

  # TEMPORARY device-verification job, on the release-test branch only. It
  # builds release with and without R8, signing both with the same fresh key
  # per run so they can replace one another on the device. Delete after testing
  # on BOOX.
  boox-release-test:
    name: Assemble BOOX English release modes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create a disposable signing key
        run: |
          keytool -genkeypair \
            -keystore boox-release-test.keystore \
            -storepass test-only \
            -keypass test-only \
            -alias boox-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=WM Keyboard CI test, OU=Test, O=WM Keyboard, C=US"

      - name: Build the BOOX fast and R8-shrunk release APKs
        env:
          RELEASE_STORE_FILE: boox-release-test.keystore
          RELEASE_STORE_PASSWORD: test-only
          RELEASE_KEY_ALIAS: boox-test
          RELEASE_KEY_PASSWORD: test-only
          WMKB_ENABLE_PLAY_STORE: 'false'
          WMKB_ENABLE_GMS: 'true'
          WMKB_SPLIT_APKS: 'true'
          WMKB_KEYMAN_LAYOUT_PACK: 'true'
        # One variant at a time: compiling both task graphs together makes the
        # Kotlin compiler exceed the runner's memory limit.
        run: |
          ./gradlew assembleEnRelease -Pwmkb.enableOnyxPen=true \
            -Pkotlin.daemon.jvmargs=-Xmx4g --stacktrace
          ./gradlew assembleEnFast -Pwmkb.enableOnyxPen=true \
            -Pkotlin.daemon.jvmargs=-Xmx4g --stacktrace

      - name: Wipe the disposable key
        if: always()
        run: rm -f boox-release-test.keystore

      - uses: actions/upload-artifact@v7
        with:
          name: apk-boox-en-fast-test
          path: app/build/outputs/apk/en/fast/app-en-arm64-v8a-fast.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: apk-boox-en-release-test
          path: |
            app/build/outputs/apk/en/release/app-en-arm64-v8a-release.apk
            app/build/outputs/mapping/enRelease/mapping.txt
          if-no-files-found: error
          retention-days: 7

  # ART never compiles a method of 10,000 dex instructions or more, and runs
  # one with a frame over 3 KB in its slow interpreter until the JIT gets to
  # it. Nothing else notices either: the keyboard just types slower. Reads the
  # dex of a `fast` build (release-mode d8, no R8, so the names are readable).
  # English only, because the dex is the same in both language flavours.
  dex-limits:
    name: Dex method limits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Check method sizes
        run: ./gradlew :app:checkDexMethodsEnFast --stacktrace

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dex-methods
          path: app/build/reports/dex-methods/
          retention-days: 7

  # Every library the APK ships, against the licences app/build.gradle.kts
  # allows. Two builds because the answer differs: the standard one carries
  # ML Kit under Google's terms, and an F-Droid build must carry nothing but
  # free licences, which the F-Droid flag makes the allow list enforce.
  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Standard
        run: ./gradlew :app:licenseeAndroidIntlRelease --stacktrace

      - name: As F-Droid builds it
        run: ./gradlew :app:licenseeAndroidIntlRelease -Pwmkb.enableFdroid=true --stacktrace

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licensee
          path: app/build/reports/licensee/
          retention-days: 7

  # Accuracy floors move when a dictionary or a ranking weight changes, which
  # is a review conversation and not a merge blocker. Reported, never gating.
  eval:
    name: Prediction & gesture evals (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # Scoped to :app because that is where the eval suites live. An
      # unqualified task name would run the filter against every module too,
      # and a Test task whose --tests filter matches nothing fails the build.
      - name: Run evals
        run: >
          ./gradlew :app:testIntlDebugUnitTest
          --tests '*.prediction.eval.*' --tests '*.gesture.eval.*'
          -Pwmkb.skipBenchmarks=true --stacktrace

  # The phone compiles regexes with ICU and the unit tests with the JDK, and
  # ICU rejects some patterns the JDK takes (a bare `}`), so a regex can pass
  # every test and crash on first use. Compiles every literal with the
  # runner's own ICU. Python only, a few seconds.
  icu-regexes:
    name: Regexes compile under ICU
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - run: python3 scripts/check_icu_regexes.py

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
        working-directory: docs

      # CHECK_LINKS=1 turns on starlight-links-validator, so a broken internal
      # link fails here instead of shipping to Pages.
      - run: npm run check
        working-directory: docs
